<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ about_company.full_name }}{% endblock %}</title>

    <!-- Шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_css %}{% endblock %}

    <!-- Favicon -->
    <link rel="icon" href="/static/images/favicon.ico" type="image/x-icon">
</head>
<body>
    <!-- Шапка сайта -->
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <img src="/media/{{ about_company.small_image }}" alt="Логотип компании">
                <div>
                    <h1>{{ about_company.full_name }}</h1>
                    <span>Точная диагностика - залог здоровья</span>
                </div>
            </div>
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
    </header>

    <!-- Меню -->
    {% include 'include_menu.html' %}

    <!-- Основное содержимое -->
    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Подвал -->
    {% include 'footer.html' %}

    <!-- Скрипты -->
    <script src="/static/js/main.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
