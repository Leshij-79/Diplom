services:
  web:
    image: ${DOCKER_USERNAME}/diplom-app:latest
    command: bash -c "
      rm -rf /code/static/* &&
      python manage.py collectstatic --noinput && 
      python manage.py migrate && 
      python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      - DEBUG=False
      - DB_HOST=db
    volumes:
      - .:/code
      - ./static:/code/static
      - static_volume:/code/static
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    expose:
      - "5432"  # Только внутри сети, не наружу
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]  # Как вариант pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"  # Только внутри сети
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  celery:
    image: ${DOCKER_USERNAME}/diplom-app:latest
    command: celery -A config worker --loglevel=info
    env_file:
      - .env
    volumes:
      - .:/code
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    image: ${DOCKER_USERNAME}/diplom-app:latest
    command: celery -A config beat --loglevel=info
    env_file:
      - .env
    volumes:
      - .:/code
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: ${DOCKER_USERNAME}/diplom-nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./staticfiles:/usr/share/nginx/html/staticfiles:ro
      - ./media:/usr/share/nginx/html/media:ro
      - static_volume:/usr/share/nginx/html/static:ro
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped


volumes:
  postgres_data:
  static_volume:
  redis_data:
