name: Django CI/CD Pipeline

on:   # [push, pull_request]
  push:
    branches:
      - Feature/Diplom
      - Develop

jobs:
  deploy:
    runs-on: ubuntu-latest
#    needs: test

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Загружаем всю историю
          ref: Feature/Diplom       # Явно указываем ветку

      - name: Copy project files to server
        run: |
          rsync -avzu --rsync-path="sudo rsync" \
          --delete \
          --exclude '__pycache__' \
          --exclude='.env' \
          --exclude='venv' \
          --exclude='*.pyc' \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='media' \
          --exclude='staticfiles' \
          --chown=${{ secrets.SSH_USER }}:${{ secrets.SSH_USER }} \
          ./ ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:${{ secrets.DEPLOY_DIR }}

      - name: Deploy application
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd ${{ secrets.DEPLOY_DIR }}

            python3 -c "
            import os
            env_vars = {
              'SECRET_KEY': '${{ secrets.SECRET_KEY }}',
              'DB_NAME': '${{ secrets.DB_NAME }}',
              'DB_USER': '${{ secrets.DB_USER }}',
              'DB_PASSWORD': '${{ secrets.DB_PASSWORD }}',
              'DB_HOST': '${{ secrets.DB_HOST }}',
              'DB_PORT': '${{ secrets.DB_PORT }}',
              'EMAIL_HOST_USER': '${{ secrets.EMAIL_HOST_USER }}',
              'EMAIL_HOST_PASSWORD': '${{ secrets.EMAIL_HOST_PASSWORD }}',
              'CELERY_BROKER_URL': '${{ secrets.CELERY_BROKER_URL }}',
              'CELERY_RESULT_BACKEND': '${{ secrets.CELERY_RESULT_BACKEND }}',
              'REDIS_HOST': '${{ secrets.REDIS_HOST }}'
            }
            with open('.env', 'w') as f:
                for key, value in env_vars.items():
                    f.write(f'{key}={value}\n')
            "
            # ВАЖНО: Загружаем переменные из .env в окружение
            set -a
            source .env
            set +a
          
            export DJANGO_SETTINGS_MODULE=config.settings

            # Абзац не обязателен psycopg2 должен работать
            sudo chown -R ${{ secrets.SSH_USER }}:${{ secrets.SSH_USER }} .
            sudo chmod -R 755 .
            rm -rf venv
            python3.14 -m venv venv
            source venv/bin/activate
            python3.14 -m pip install --upgrade pip
      
            mkdir -p staticfiles
            cp -r staticfiles/* ${{ secrets.DEPLOY_DIR }}/staticfiles/ 2>/dev/null || true
            python manage.py migrate  # не обязательно, тк это уже есть в docker-compose.yml
            python manage.py collectstatic --noinput  # можно добавить ключ -с # есть в docker-compose
          
            # Копируем статику в место для nginx # проверить, не обязательно а также имена папок
            sudo mkdir -p /usr/share/nginx/html/static
            sudo cp -r staticfiles/* /usr/share/nginx/html/static/ 2>/dev/null || true
            sudo chown -R ${{ secrets.SSH_USER }}:${{ secrets.SSH_USER }} /usr/share/nginx/html/static
          
            # Перезапускаем контейнеры
            docker-compose down
            docker-compose up -d --build
            #sudo systemctl restart myapp.service
          EOF
